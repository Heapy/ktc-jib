name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-kotlin-script
      - uses: Heapy/setup-ktc@52e4da5405a2dc056dd0c42ac86390c797d12f5d # v1.0.1
        with:
          version: 0.13.0
      - name: Test plugin
        run: ./kotlin test -m jib
      - name: Build offline fixture image
        run: ./kotlin do jibTar -m app
      - name: Inspect image contents
        run: kotlinr scripts/verify-tar.main.kts
